[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kmer-denovo-filter"
version = "0.1.0"
description = "De novo variant curation using k-mer analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "pysam>=0.21.0",
    # Discovery mode's read scan (Module 3) encodes k-mers and reads as
    # 2-bit codes and tests membership with numpy; nothing else is needed.
    "numpy>=1.22",
    "plotly>=5.18.0",
    "jinja2>=3.1.0",
    # Non-human contamination screening (Kraken2Runner + allele-based NHF) is
    # provided by the standalone nonhuman-screen package
    # (https://github.com/jlanej/nonhuman-screen). The [bam] extra pulls pysam
    # for the allele-based helpers the VCF pipeline uses.
    "nonhuman-screen[bam]>=0.1,<0.2",
]

[project.scripts]
kmer-denovo = "kmer_denovo_filter.cli:vcf_main"
kmer-discovery = "kmer_denovo_filter.cli:discovery_main"
kmer-report = "kmer_denovo_filter.cli:report_main"
kmer-nhf = "kmer_denovo_filter.cli:nhf_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
