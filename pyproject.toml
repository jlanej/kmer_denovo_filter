[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kmer-denovo-filter"
version = "0.1.0"
description = "De novo variant curation using k-mer analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "pysam>=0.21.0",
    "pyahocorasick>=2.0.0",
    "plotly>=5.18.0",
    "jinja2>=3.1.0",
    # Non-human contamination screening (Kraken2Runner + allele-based NHF) was
    # extracted into the standalone `nonhuman-screen` package. Until it is
    # published to PyPI it is installed from the in-repo path
    # `packages/nonhuman-screen` (see README / Dockerfile / CI); this
    # declaration documents the runtime requirement and is satisfied once that
    # local install has happened.
    "nonhuman-screen>=0.1,<0.2",
]

[project.scripts]
kmer-denovo = "kmer_denovo_filter.cli:vcf_main"
kmer-discovery = "kmer_denovo_filter.cli:discovery_main"
kmer-report = "kmer_denovo_filter.cli:report_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
