# Build and publish nonhuman-screen to PyPI on a version tag.
#
# Uses PyPI Trusted Publishing (OIDC) — configure the publisher for this
# repository at https://pypi.org/manage/account/publishing/ (no API token
# needed). Dormant until this directory becomes its own repository (see ci.yml).
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
